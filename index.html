<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LAST BELL — Arcade Boxing</title>
<style>
  html,body{margin:0;height:100%;background:#0a0a0e;overflow:hidden;font-family:Arial,Helvetica,sans-serif}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{background:#0a0a0e;image-rendering:auto;max-width:100%;max-height:100%}
  #hint{position:fixed;left:8px;bottom:6px;color:#667;font-size:12px;user-select:none}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="960" height="540"></canvas></div>
<div id="hint">A/D move · S duck · Space dodge · J jab · K hook · L uppercut · Enter confirm · &uarr;/&darr; select · Backspace back · R rematch</div>
<script>
"use strict";
const cv = document.getElementById("c"), ctx = cv.getContext("2d");
const W = 960, H = 540;

// ---------- input ----------
const keys = {}, justPressed = {};
addEventListener("keydown", e => {
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  if (!keys[k]) justPressed[k] = true;
  keys[k] = true;
  if ([" ","ArrowUp","ArrowDown","Backspace"].includes(e.key)) e.preventDefault();
});
addEventListener("keyup", e => { const k = e.key.length===1 ? e.key.toLowerCase():e.key; keys[k]=false; });
function pressed(k){ return !!justPressed[k]; }
function clearPressed(){ for (const k in justPressed) delete justPressed[k]; }

// ---------- fighter data (mirrors FighterFactory.cpp) ----------
function atk(dmg,st,ko,startup,active,recovery,range,knock){return{dmg,st,ko,startup,active,recovery,range,knock};}
function makePlayer(){return{
  name:"YOU", body:"#1f73ff", trunk:"#0d1733", glove:"#5aa0ff", isPlayer:true,
  maxHp:100,maxSt:100,regen:16,maxKo:100,koDecay:3,def:1.0,speed:320,
  jab:atk(7,8,6,0.12,0.08,0.18,165,180), hook:atk(13,16,12,0.18,0.09,0.28,150,260), upper:atk(20,26,22,0.24,0.10,0.40,135,400),
  pers:{freq:1.2,dodge:0.35,wJab:.45,wHook:.35,wUp:.20}, build:1.0 };}
function makeOpp(type){
  if(type===1) return {name:'SAL "SLIP" CORRALES',body:"#e6c01a",trunk:"#1a1a1a",glove:"#ffe14d",
    maxHp:100,maxSt:110,regen:18,maxKo:100,koDecay:3,def:1.0,speed:340,
    jab:atk(8,8,8,0.16,0.08,0.20,165,190),hook:atk(14,15,13,0.20,0.08,0.26,150,270),upper:atk(19,24,20,0.22,0.09,0.36,135,380),
    pers:{freq:1.6,dodge:0.55,wJab:.45,wHook:.35,wUp:.20},build:0.9};
  if(type===2) return {name:'BRUNO "THE BOULDER" MACK',body:"#b21a1a",trunk:"#1a0d0d",glove:"#ff5a3c",
    maxHp:150,maxSt:90,regen:12,maxKo:100,koDecay:3,def:0.85,speed:220,
    jab:atk(14,12,10,0.22,0.10,0.26,170,260),hook:atk(26,20,18,0.28,0.11,0.36,155,360),upper:atk(35,30,28,0.34,0.12,0.50,140,520),
    pers:{freq:0.8,dodge:0.15,wJab:.30,wHook:.30,wUp:.40},build:1.35};
  return {name:'REX "ROOKIE" RAMONE',body:"#33b34d",trunk:"#0d1a0d",glove:"#7be08a",
    maxHp:120,maxSt:100,regen:14,maxKo:100,koDecay:3,def:1.05,speed:240,
    jab:atk(8,9,7,0.22,0.09,0.24,160,180),hook:atk(14,17,12,0.26,0.10,0.32,145,250),upper:atk(19,26,20,0.30,0.11,0.44,130,360),
    pers:{freq:1.0,dodge:0.2,wJab:.6,wHook:.3,wUp:.1},build:1.06};
}

// ---------- fighter runtime ----------
function spawn(data,x,faceRight){
  return {d:data,x,face:faceRight?1:-1,
    hp:data.maxHp,st:data.maxSt,ko:0,
    state:"idle",            // idle, attack, hitstun, dodge, duck, down, ko, win, lose
    stTimer:0, atk:null, atkT:0, hitDone:false, lastMove:"jab",
    sinceSt:9, think:0, intent:0, dodgeDir:1, animT:0,
    lg:{x:0,y:0}, rg:{x:0,y:0}, lean:0, bodyY:0, bodyRot:0 };
}

// ---------- match state ----------
const RING={cx:480, halfX:300, floorY:430}; // ground line for feet
let scene="menu", menuIdx=0, selIdx=0;
let player=null, ai=null, oppType=0;
let round=1, totalRounds=3, pWins=0, aWins=0;
let roundTime=99, roundTimer=0, matchState="intro", stateTimer=0, knockCount=0;
let resultWon=false, fightFlash=0, koFlash=0, shake=0, slow=1, hitStop=0, bannerTimer=0;
let crowd=[];

function initCrowd(){
  crowd=[];
  for(let tier=0;tier<3;tier++){
    const n=26+tier*6, baseY=150-tier*26, r=tier;
    for(let i=0;i<n;i++){
      crowd.push({x: 40 + i*(880/n) + (tier%2)*8, y:baseY, ph:Math.random()*6.28, h:14+Math.random()*8, tier:r});
    }
  }
}
function startMatch(){
  player=spawn(makePlayer(), 380, true);
  ai=spawn(makeOpp(oppType), 580, false);
  round=1;pWins=0;aWins=0; beginRound();
}
function beginRound(){
  player.hp=player.d.maxHp;player.st=player.d.maxSt;player.ko=0;player.state="idle";player.x=380;player.intent=0;
  ai.hp=ai.d.maxHp;ai.st=ai.d.maxSt;ai.ko=0;ai.state="idle";ai.x=580;ai.intent=0;
  roundTime=99; matchState="intro"; stateTimer=2.2; bannerTimer=0;
}
function endRound(playerWon,byKO){
  if(matchState==="over")return;
  if(playerWon)pWins++;else aWins++;
  if(byKO || pWins>totalRounds/2 || aWins>totalRounds/2 || round>=totalRounds){
    matchState="over"; stateTimer=2.0; resultWon=(pWins>aWins)|| (byKO&&playerWon);
    if(byKO) resultWon=playerWon;
  } else { matchState="between"; stateTimer=2.6; }
}

// ---------- combat ----------
function canAct(f){return f.state==="idle"||f.state==="duck";}
function startAttack(f,move){
  if(matchState!=="round")return;
  if(!(f.state==="idle"))return;
  const a=f.d[move]; if(f.st<a.st)return;
  f.st-=a.st; f.sinceSt=0; f.atk=a; f.atkT=0; f.hitDone=false; f.lastMove=move; f.state="attack";
  f.ko_self=(f.ko_self||0);
}
function phase(f){ if(f.state!=="attack")return"none"; const a=f.atk;
  if(f.atkT<a.startup)return"startup"; if(f.atkT<a.startup+a.active)return"active"; return"recovery";}
function dist(){return Math.abs(player.x-ai.x);}
function evading(t,move){ if(t.state==="dodge")return true; if(t.state==="duck"&&move!=="upper")return true; return false;}
function applyHit(att,def){
  const a=att.atk;
  def.hp=Math.max(0,def.hp - a.dmg*def.d.def);
  def.ko=Math.min(def.d.maxKo, def.ko + a.ko);
  def.state="hitstun"; def.stTimer=0.3;
  // knockback
  def.x += att.face*Math.min(40,a.knock*0.06);
  shake=Math.min(14, 5+a.dmg*0.4); hitStop=0.05; koFlashMaybe(a);
  if(def.hp<=0){ koSequence(def===player); }
  else if(def.ko>=def.d.maxKo){ def.ko=0; knockdownSequence(def===player); }
}
function koFlashMaybe(a){ if(a.dmg>=15) koFlash=Math.max(koFlash,0.12); }
function koSequence(playerDown){
  (playerDown?player:ai).state="ko"; (playerDown?player:ai).bodyRot=1;
  koFlash=0.5; shake=16; slow=0.18; matchState="ko"; stateTimer=2.4; resultWon=!playerDown;
}
function knockdownSequence(playerDown){
  (playerDown?player:ai).state="down";
  matchState="knockdown"; knockCount=0; stateTimer=1; slow=0.4;
}

// ---------- AI ----------
function aiThink(dt){
  ai.think-=dt; if(ai.think>0)return; ai.think=0.34;
  if(!canAct(ai)){ai.intent=0;return;}
  const D=dist(), p=ai.d.pers;
  if(player.state==="attack" && D<ai.d.jab.range*1.4 && Math.random()<p.dodge){ ai.state="dodge";ai.stTimer=0.3;ai.dodgeDir=(Math.random()<.5?1:-1);ai.intent=0;return;}
  if(ai.hp/ai.d.maxHp<0.18 && Math.random()<0.4){ai.intent=-1;return;}
  if(D<=ai.d.jab.range){ ai.intent=0;
    let chance=0.32*p.freq; if(Math.random()<chance){
      const r=Math.random(); let m=(r<p.wJab)?"jab":(r<p.wJab+p.wHook)?"hook":"upper"; startAttack(ai,m);
    }
  } else ai.intent=1;
}

// ---------- update ----------
function updFighter(f,opp,dt){
  f.animT+=dt; f.sinceSt+=dt;
  if(f.st<f.d.maxSt && f.sinceSt>1.1) f.st=Math.min(f.d.maxSt,f.st+f.d.regen*dt);
  if(f.ko>0) f.ko=Math.max(0,f.ko-f.d.koDecay*dt);
  if(f.state==="hitstun"||f.state==="dodge"){ f.stTimer-=dt; if(f.stTimer<=0)f.state="idle"; }
  if(f.state==="attack"){ f.atkT+=dt; const ph=phase(f);
    if(ph==="active"&&!f.hitDone){ if(dist()<=f.atk.range && !evading(opp,f.lastMove)){ f.hitDone=true; applyHit(f,opp); } }
    if(f.atkT>=f.atk.startup+f.atk.active+f.atk.recovery) f.state="idle";
  }
  // face opponent
  f.face = (opp.x>=f.x)?1:-1;
}
function moveFighter(f,dir,dt){ // dir: input for player handled separately
  f.x += dir*f.d.speed*dt;
  f.x = Math.max(RING.cx-RING.halfX+30, Math.min(RING.cx+RING.halfX-30, f.x));
}

function update(dt){
  for(const k in justPressed){} // noop placeholder
  // global feel
  if(hitStop>0){ hitStop-=dt; clearPressed(); return; }
  if(shake>0) shake=Math.max(0,shake-dt*40);
  if(koFlash>0) koFlash-=dt;
  if(fightFlash>0) fightFlash-=dt;
  if(slow<1) slow=Math.min(1, slow+dt*0.6);

  if(scene==="menu"){ menu(); }
  else if(scene==="select"){ select(); }
  else if(scene==="fight"){ fight(dt); }
  clearPressed();
}

function menu(){
  if(pressed("ArrowUp")||pressed("ArrowDown")||pressed("w")||pressed("s")) menuIdx=(menuIdx+1)%2;
  if(pressed("Enter")){ if(menuIdx===0){scene="select";selIdx=0;} }
}
function select(){
  if(pressed("ArrowUp")||pressed("w")) selIdx=(selIdx+2)%3;
  if(pressed("ArrowDown")||pressed("s")) selIdx=(selIdx+1)%3;
  if(pressed("Enter")){ oppType=selIdx; scene="fight"; startMatch(); }
  if(pressed("Backspace")||pressed("Escape")){ scene="menu"; menuIdx=0; }
}

function fight(dt){
  const sdt=dt*slow;
  // global escape/back
  if((matchState==="round"||matchState==="intro") && (pressed("Backspace")||pressed("Escape"))){ scene="menu"; return; }

  if(matchState==="intro"){ stateTimer-=dt; if(stateTimer<=0){ matchState="round"; roundTime=99; roundTimer=0; fightFlash=1.1; } }
  else if(matchState==="round"){
    // player input
    if(canAct(player)){
      let mv=0; if(keys["a"])mv-=1; if(keys["d"])mv+=1; if(mv!==0) moveFighter(player,mv,sdt);
      if(keys["s"]&&player.state==="idle"){player.state="duck";}
      if(!keys["s"]&&player.state==="duck"){player.state="idle";}
      if(pressed(" ")){player.state="dodge";player.stTimer=0.3;player.dodgeDir=(keys["a"]?-1:1);}
      if(pressed("j"))startAttack(player,"jab");
      if(pressed("k"))startAttack(player,"hook");
      if(pressed("l"))startAttack(player,"upper");
    }
    aiThink(sdt);
    if(ai.intent!==0 && canAct(ai)){
      const toP=(player.x-ai.x); const dir=Math.sign(toP)*(ai.intent>0?1:-1);
      if(!(ai.intent>0 && dist()<ai.d.jab.range*0.8)) moveFighter(ai,dir*Math.abs(ai.intent),sdt*ai.d.pers.freq*0.9);
    }
    updFighter(player,ai,sdt); updFighter(ai,player,sdt);
    roundTimer+=dt; if(roundTimer>=1){roundTimer-=1;roundTime--; if(roundTime<=0){ endRound(player.hp/player.d.maxHp>=ai.hp/ai.d.maxHp,false);} }
  }
  else if(matchState==="knockdown"){
    updFighter(player,ai,sdt); updFighter(ai,player,sdt);
    stateTimer-=dt; if(stateTimer<=0){ stateTimer=1; knockCount++; if(knockCount>=10){ const pDown=player.state==="down"; endRound(!pDown,true);} }
  }
  else if(matchState==="ko"){
    updFighter(player,ai,sdt); updFighter(ai,player,sdt);
    stateTimer-=dt; if(stateTimer<=0){ matchState="over"; stateTimer=1.5; }
  }
  else if(matchState==="between"){
    stateTimer-=dt; if(stateTimer<=0){ round++; beginRound(); }
  }
  else if(matchState==="over"){
    player.state=resultWon?"win":"lose"; ai.state=resultWon?"lose":"win";
    if(pressed("r")){ startMatch(); }
    if(pressed("Backspace")||pressed("Escape")||pressed("Enter")){ scene="menu"; slow=1; }
  }
  // resolve animation targets
  animFighter(player,sdt); animFighter(ai,sdt);
}

// ---------- procedural fighter animation ----------
function lerp(a,b,t){return a+(b-a)*t;}
function animFighter(f,dt){
  const sp=10*dt; const bob=Math.sin(f.animT*2.4)*1.5;
  let lg={x:14,y:-44+bob}, rg={x:14,y:-44+bob}, lean=0, bodyY=0, rot=0, gs=12*dt;
  const ph=phase(f);
  if(f.state==="attack"){
    if(f.lastMove==="jab"){ if(ph==="active"){lg={x:52,y:-46};gs=26*dt;} else if(ph==="startup"){lg={x:4,y:-44};} }
    else if(f.lastMove==="hook"){ if(ph==="active"){lg={x:46,y:-44};gs=24*dt;} else if(ph==="startup"){lg={x:2,y:-50};} }
    else if(f.lastMove==="upper"){ if(ph==="active"){rg={x:42,y:-72};gs=24*dt;} else if(ph==="startup"){rg={x:14,y:-22};} }
  } else if(f.state==="duck"){ bodyY=18; lg.y+=12;rg.y+=12; }
  else if(f.state==="dodge"){ lean=f.dodgeDir*0.5; }
  else if(f.state==="hitstun"){ lean=-f.face*0.3; lg={x:8,y:-40};rg={x:8,y:-40}; }
  else if(f.state==="down"||f.state==="ko"){ rot=1.1; bodyY=26; lg={x:0,y:-6};rg={x:0,y:-6}; }
  else if(f.state==="win"){ lg={x:6,y:-78};rg={x:6,y:-78}; }
  else if(f.state==="lose"){ rot=0.6; bodyY=10; }
  f.lg.x=lerp(f.lg.x,lg.x,gs); f.lg.y=lerp(f.lg.y,lg.y,gs);
  f.rg.x=lerp(f.rg.x,rg.x,gs); f.rg.y=lerp(f.rg.y,rg.y,gs);
  f.lean=lerp(f.lean,lean,sp); f.bodyY=lerp(f.bodyY,bodyY,8*dt); f.bodyRot=lerp(f.bodyRot,rot,7*dt);
}

// ---------- render ----------
function drawFighter(f){
  const baseY=RING.floorY, s=f.d.build;
  ctx.save();
  ctx.translate(f.x, baseY - f.bodyY*1);
  ctx.scale(f.face,1);
  ctx.rotate(-f.lean);
  ctx.rotate(f.bodyRot*0.9);
  // legs
  ctx.fillStyle=f.d.trunk; ctx.fillRect(-12*s,-70,9*s,70); ctx.fillRect(4*s,-70,9*s,70);
  // torso
  ctx.fillStyle=f.d.body; roundRect(-16*s,-128,32*s,64,6); ctx.fill();
  // trunks
  ctx.fillStyle=f.d.trunk; ctx.fillRect(-16*s,-72,32*s,16);
  // head
  ctx.fillStyle="#caa07a"; ctx.beginPath(); ctx.arc(2*s,-150,12*s,0,7); ctx.fill();
  // gloves
  ctx.fillStyle=f.d.glove;
  ctx.beginPath(); ctx.arc(f.lg.x*s, -84+f.lg.y, 9*s,0,7); ctx.fill();
  ctx.beginPath(); ctx.arc(f.rg.x*s, -84+f.rg.y, 8.5*s,0,7); ctx.fill();
  ctx.restore();
}
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function text(t,x,y,size,col,center,glow){
  ctx.font="900 "+size+"px Arial"; ctx.textAlign=center?"center":"left"; ctx.textBaseline="alphabetic";
  ctx.fillStyle="rgba(0,0,0,.7)"; ctx.fillText(t,x+2,y+2);
  ctx.fillStyle=col; ctx.fillText(t,x,y);
}
function bar(x,y,w,h,frac,col,rtl){
  frac=Math.max(0,Math.min(1,frac));
  ctx.fillStyle="rgba(0,0,0,.8)";ctx.fillRect(x-2,y-2,w+4,h+4);
  ctx.fillStyle="#16161c";ctx.fillRect(x,y,w,h);
  const fw=w*frac, fx=rtl?(x+w-fw):x; ctx.fillStyle=col; ctx.fillRect(fx,y,fw,h);
  ctx.fillStyle="rgba(255,255,255,.15)";ctx.fillRect(fx,y,fw,h*0.35);
}

function drawArena(){
  // bg gradient
  let g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,"#16121e");g.addColorStop(1,"#070709"); ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // colored arena glows
  ctx.fillStyle="rgba(40,80,255,.06)";ctx.fillRect(0,0,W/2,H);
  ctx.fillStyle="rgba(255,90,30,.06)";ctx.fillRect(W/2,0,W/2,H);
  // crowd
  for(const c of crowd){ const b=Math.max(0,Math.sin(performance.now()/300+c.ph))*6; ctx.fillStyle=c.tier===0?"#15151c":c.tier===1?"#101016":"#0c0c11"; ctx.fillRect(c.x,c.y-b,7,c.h+b); }
  // ring platform
  ctx.fillStyle="#0c0c12"; ctx.fillRect(120,RING.floorY,720,90);
  ctx.fillStyle="#5a0d14"; ctx.fillRect(120,RING.floorY-6,720,8); // apron
  // mat
  ctx.fillStyle="#0e2245"; ctx.fillRect(150,RING.floorY-2,660,8);
  // mat logo
  ctx.fillStyle="rgba(240,200,40,.5)"; ctx.beginPath(); ctx.ellipse(480,RING.floorY+1,90,7,0,0,7);ctx.fill();
  // posts + ropes
  ctx.fillStyle="#2a2a30"; ctx.fillRect(150,RING.floorY-150,8,150); ctx.fillRect(802,RING.floorY-150,8,150);
  for(const ry of [40,80,120]){ ctx.strokeStyle="#d8d8dc"; ctx.lineWidth=3; ctx.beginPath();ctx.moveTo(154,RING.floorY-ry);ctx.lineTo(806,RING.floorY-ry);ctx.stroke(); }
  ctx.fillStyle="#b21a1a"; ctx.fillRect(146,RING.floorY-128,16,34); ctx.fillStyle="#1a3ab2"; ctx.fillRect(798,RING.floorY-128,16,34);
}

function drawHUD(){
  const gm=matchState;
  bar(34,40,360,24, player.hp/player.d.maxHp, "#e02828", false); text("YOU",34,32,18,"#fff");
  bar(34,72,360,11, player.st/player.d.maxSt, "#f2c81e", false);
  bar(W-34-360,40,360,24, ai.hp/ai.d.maxHp, "#e02828", true);
  ctx.font="900 16px Arial"; ctx.textAlign="right"; ctx.fillStyle="rgba(0,0,0,.7)"; ctx.fillText(ai.d.name,W-32,34); ctx.fillStyle="#fff"; ctx.fillText(ai.d.name,W-34,32);
  bar(W-34-360,72,360,11, ai.st/ai.d.maxSt, "#f2c81e", true);
  // center timer / intro
  if(gm==="intro"||gm==="between"){
    text("ROUND "+round, W/2, 60, 34, "#ffd84d", true);
    text("GET READY", W/2, 92, 18, "#fff", true);
  } else if(gm==="round"){
    ctx.fillStyle="rgba(0,0,0,.5)";ctx.fillRect(W/2-46,30,92,52);
    text((""+Math.max(0,roundTime)).padStart(2,"0"), W/2, 70, 36, "#fff", true);
    text("ROUND "+round+" / "+totalRounds, W/2, 96, 14, "#ddd", true);
  }
  if(fightFlash>0){ const a=fightFlash/1.1; text("FIGHT!", W/2, H*0.42, 54+(1-a)*20, "rgba(255,"+(90+120*a)+",30,1)", true); }
  if(gm==="knockdown"){ ctx.fillStyle="rgba(0,0,0,.45)";ctx.fillRect(0,H*0.3,W,H*0.36); text(""+knockCount, W/2, H*0.5, 90,"#ffd84d",true); text("DOWN!",W/2,H*0.34,28,"#ff5a3c",true); }
}

function drawScene(){
  ctx.save();
  if(shake>0){ ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake); }
  drawArena();
  if(scene==="fight"){ // draw fighters back-to-front
    drawFighter(ai); drawFighter(player); drawHUD();
    if(matchState==="over"){
      ctx.fillStyle="rgba(0,0,0,.6)";ctx.fillRect(0,0,W,H);
      text(resultWon?"YOU WIN":"YOU LOSE", W/2, H*0.42, 64, resultWon?"#ffd84d":"#e63232", true);
      text("R  rematch     ENTER / BACKSPACE  menu", W/2, H*0.56, 20, "#fff", true);
    }
  } else if(scene==="menu"){
    text("LAST BELL", W/2, H*0.30, 72, "#ffd84d", true);
    text("ARCADE BOXING", W/2, H*0.40, 22, "#ccd", true);
    const opts=["START","QUIT"];
    for(let i=0;i<2;i++){ const sel=i===menuIdx; text((sel?"> ":"  ")+opts[i]+(sel?" <":""), W/2, H*0.55+i*46, 28, sel?"#ffe14d":"#99a", true); }
    text("Up / Down  select        Enter  confirm", W/2, H*0.86, 16, "#889", true);
  } else if(scene==="select"){
    text("SELECT OPPONENT", W/2, H*0.18, 36, "#ffd84d", true);
    const nm=['REX "ROOKIE" RAMONE','SAL "SLIP" CORRALES','BRUNO "THE BOULDER" MACK'];
    const ds=["Rookie — slow, predictable, forgiving","Counter Boxer — dodges and counters","Heavyweight — slow but devastating"];
    const cols=["#7be08a","#ffe14d","#ff5a3c"];
    for(let i=0;i<3;i++){ const sel=i===selIdx, y=H*0.36+i*70;
      if(sel){ctx.fillStyle="rgba(240,200,40,.14)";ctx.fillRect(W*0.16,y-26,W*0.68,58);}
      text((sel?"> ":"")+nm[i], W/2, y, 26, sel?"#fff":cols[i], true);
      text(ds[i], W/2, y+24, 15, "#99a", true);
    }
    text("Up / Down  select     Enter  fight     Backspace  back", W/2, H*0.9, 16, "#889", true);
  }
  ctx.restore();
  if(koFlash>0){ ctx.fillStyle="rgba(255,255,255,"+Math.min(0.8,koFlash*1.6)+")"; ctx.fillRect(0,0,W,H); }
}

// ---------- loop ----------
initCrowd();
let last=performance.now();
function frame(now){
  let dt=(now-last)/1000; last=now; if(dt>0.05)dt=0.05;
  update(dt); drawScene();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
